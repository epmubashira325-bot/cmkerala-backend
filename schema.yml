            * `ALAPPUZHA` - Alappuzha
            * `ERNAKULAM` - Ernakulam
            * `IDUKKI` - Idukki
            * `KANNUR` - Kannur
            * `KASARAGOD` - Kasaragod
            * `KOLLAM` - Kollam
            * `KOTTAYAM` - Kottayam
            * `KOZHIKODE` - Kozhikode
            * `MALAPPURAM` - Malappuram
            * `PALAKKAD` - Palakkad
            * `PATHANAMTHITTA` - Pathanamthitta
            * `THIRUVANANTHAPURAM` - Thiruvananthapuram
            * `THRISSUR` - Thrissur
            * `WAYANAD` - Wayanad
        category:
          type: string
          minLength: 1
          description: Grievance classification (e.g., Public Infrastructure, Healthcare,
            Revenue, Welfare).
          maxLength: 120
        subject:
          type: string
          minLength: 1
          description: Brief subject of the grievance.
          maxLength: 255
        description:
          type: string
          minLength: 1
          description: Detailed description of the citizen's complaint.
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          description: |-
            Priority level assessed manually or via AI triage.

            * `LOW` - Low
            * `MEDIUM` - Medium
            * `HIGH` - High
        attachments:
          type: array
          items:
            type: string
