            schema:
              $ref: '#/components/schemas/ActionTakenReportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTakenReport'
          description: ''
  /api/v1/public/contact/:
    post:
      operationId: v1_public_contact_create
      description: Public endpoint to submit general contact enquiries.
      summary: 'Public: Submit general contact enquiry'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactEnquiryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactEnquiryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactEnquiryRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
