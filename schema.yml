        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - REOPENED
          - RESOLVED
          - SUBMITTED
          - UNDER_REVIEW
        description: |-
          Current life-cycle status of the grievance.

          * `SUBMITTED` - Submitted
          * `UNDER_REVIEW` - Under Review
          * `IN_PROGRESS` - In Progress
          * `RESOLVED` - Resolved
          * `REOPENED` - Reopened
