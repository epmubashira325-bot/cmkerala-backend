            schema:
              $ref: '#/components/schemas/RemarkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemarkRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remark'
          description: ''
  /api/v1/officer/grievances/{id}/reports/:
    post:
      operationId: v1_officer_grievances_reports_create
