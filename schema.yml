        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique feedback identifier.
        grievance:
          type: string
          format: uuid
          description: Grievance being rated.
          readOnly: true
        citizen:
          type: string
          format: uuid
          description: Citizen providing feedback.
          readOnly: true
        citizen_name:
          type: string
