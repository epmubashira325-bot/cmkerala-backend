            * `KOTTAYAM` - Kottayam
            * `KOZHIKODE` - Kozhikode
            * `MALAPPURAM` - Malappuram
            * `PALAKKAD` - Palakkad
            * `PATHANAMTHITTA` - Pathanamthitta
            * `THIRUVANANTHAPURAM` - Thiruvananthapuram
            * `THRISSUR` - Thrissur
            * `WAYANAD` - Wayanad
        category:
