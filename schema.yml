openapi: 3.0.3
info:
  title: CM Kerala - Chief Minister's Public Grievance Redressal Portal API
  version: 1.0.0
  description: Official RESTful API documentation for Citizen, Officer, and CMO Admin
    workflows.
paths:
  /api/v1/ai/analyze/:
    post:
      operationId: v1_ai_analyze_create
      description: Provides automated triage suggestions for complaint category, priority
        level, and department routing. Suggestions are advisory and can be reviewed
        before submission.
      summary: 'Citizen: Analyze grievance draft using Google Gemini AI'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAnalyzeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIAnalyzeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIAnalyzeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAnalyzeResponse'
          description: ''
        '400':
          description: Invalid request fields
        '429':
          description: Rate limit exceeded
        '503':
          description: AI service temporarily unavailable (fallback to manual submission)
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticates citizen, officer, or CMO admin and returns JWT tokens
        with user profile.
      summary: User Login (Email and Password)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Invalidate refresh token and perform secure logout.
      summary: User Logout
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Successfully logged out
        '400':
          description: Invalid or expired token
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Retrieve authenticated user profile.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: |-
        Register a new citizen account.
        Public registration strictly creates CITIZEN role accounts.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CitizenRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CitizenRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenRegistration'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/citizen/grievances/:
    get:
      operationId: v1_citizen_grievances_list
      description: List citizen's own grievances or submit a new grievance with optional
        attachments.
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: department
        schema:
          type: string
          format: uuid
      - in: query
        name: district
        schema:
          type: string
          enum:
          - ALAPPUZHA
          - ERNAKULAM
          - IDUKKI
          - KANNUR
          - KASARAGOD
          - KOLLAM
          - KOTTAYAM
          - KOZHIKODE
          - MALAPPURAM
          - PALAKKAD
          - PATHANAMTHITTA
          - THIRUVANANTHAPURAM
          - THRISSUR
          - WAYANAD
        description: |-
          Kerala District where grievance originated.

          * `ALAPPUZHA` - Alappuzha
          * `ERNAKULAM` - Ernakulam
          * `IDUKKI` - Idukki
          * `KANNUR` - Kannur
          * `KASARAGOD` - Kasaragod
          * `KOLLAM` - Kollam
          * `KOTTAYAM` - Kottayam
          * `KOZHIKODE` - Kozhikode
          * `MALAPPURAM` - Malappuram
          * `PALAKKAD` - Palakkad
          * `PATHANAMTHITTA` - Pathanamthitta
          * `THIRUVANANTHAPURAM` - Thiruvananthapuram
          * `THRISSUR` - Thrissur
          * `WAYANAD` - Wayanad
      - in: query
        name: is_escalated
        schema:
          type: boolean
      - in: query
        name: officer
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: |-
          Priority level assessed manually or via AI triage.

          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - REOPENED
          - RESOLVED
          - SUBMITTED
          - UNDER_REVIEW
        description: |-
          Current life-cycle status of the grievance.

          * `SUBMITTED` - Submitted
          * `UNDER_REVIEW` - Under Review
          * `IN_PROGRESS` - In Progress
          * `RESOLVED` - Resolved
          * `REOPENED` - Reopened
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGrievanceListList'
          description: ''
    post:
      operationId: v1_citizen_grievances_create
      description: List citizen's own grievances or submit a new grievance with optional
        attachments.
      summary: 'Citizen: Submit a new grievance'
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CitizenGrievanceCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CitizenGrievanceCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenGrievanceCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenGrievanceCreate'
          description: ''
  /api/v1/citizen/grievances/{id}/:
    get:
      operationId: v1_citizen_grievances_retrieve
      description: Retrieve full details and history for a citizen's own grievance.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceDetail'
          description: ''
  /api/v1/citizen/grievances/{id}/feedback/:
    post:
      operationId: v1_citizen_grievances_feedback_create
      description: Submit feedback rating for a resolved grievance.
      summary: 'Citizen: Submit satisfaction feedback for resolved grievance'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenFeedbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CitizenFeedbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CitizenFeedbackRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenFeedback'
          description: ''
  /api/v1/cmo/departments/:
    get:
      operationId: v1_cmo_departments_list
      description: CMO administration endpoint to list all departments (including
        inactive) and create new ones.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
    post:
      operationId: v1_cmo_departments_create
      description: CMO administration endpoint to list all departments (including
        inactive) and create new ones.
      summary: 'CMO: List or create department'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/cmo/departments/{id}/:
    get:
      operationId: v1_cmo_departments_retrieve
      description: CMO administration endpoint to retrieve and modify department details.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    put:
      operationId: v1_cmo_departments_update
      description: CMO administration endpoint to retrieve and modify department details.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    patch:
      operationId: v1_cmo_departments_partial_update
      description: CMO administration endpoint to retrieve and modify department details.
      summary: 'CMO: Retrieve or update department'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/cmo/grievances/:
    get:
      operationId: v1_cmo_grievances_list
      description: 'CMO: View and filter all citizen grievances across all departments
        and districts.'
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: department
        schema:
          type: string
          format: uuid
      - in: query
        name: district
        schema:
          type: string
          enum:
          - ALAPPUZHA
          - ERNAKULAM
          - IDUKKI
          - KANNUR
          - KASARAGOD
          - KOLLAM
          - KOTTAYAM
          - KOZHIKODE
          - MALAPPURAM
          - PALAKKAD
          - PATHANAMTHITTA
          - THIRUVANANTHAPURAM
          - THRISSUR
          - WAYANAD
        description: |-
          Kerala District where grievance originated.

          * `ALAPPUZHA` - Alappuzha
          * `ERNAKULAM` - Ernakulam
          * `IDUKKI` - Idukki
          * `KANNUR` - Kannur
          * `KASARAGOD` - Kasaragod
          * `KOLLAM` - Kollam
          * `KOTTAYAM` - Kottayam
          * `KOZHIKODE` - Kozhikode
          * `MALAPPURAM` - Malappuram
          * `PALAKKAD` - Palakkad
          * `PATHANAMTHITTA` - Pathanamthitta
          * `THIRUVANANTHAPURAM` - Thiruvananthapuram
          * `THRISSUR` - Thrissur
          * `WAYANAD` - Wayanad
      - in: query
        name: is_escalated
        schema:
          type: boolean
      - in: query
        name: officer
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: |-
          Priority level assessed manually or via AI triage.

          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - REOPENED
          - RESOLVED
          - SUBMITTED
          - UNDER_REVIEW
        description: |-
          Current life-cycle status of the grievance.

          * `SUBMITTED` - Submitted
          * `UNDER_REVIEW` - Under Review
          * `IN_PROGRESS` - In Progress
          * `RESOLVED` - Resolved
          * `REOPENED` - Reopened
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGrievanceListList'
          description: ''
  /api/v1/cmo/grievances/{id}/:
    get:
      operationId: v1_cmo_grievances_retrieve
      description: 'CMO: View complete details, attachments, history logs, and ATRs
        for any grievance.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceDetail'
          description: ''
  /api/v1/cmo/grievances/{id}/assign/:
    post:
      operationId: v1_cmo_grievances_assign_create
      description: 'CMO: Assign or reassign grievance to a department and/or specific
        officer.'
      summary: 'CMO: Assign grievance to department and officer'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDepartmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignDepartmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignDepartmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignDepartment'
          description: ''
  /api/v1/cmo/grievances/{id}/escalate/:
    post:
      operationId: v1_cmo_grievances_escalate_create
      description: 'CMO: Flag grievance as escalated.'
      summary: 'CMO: Escalate grievance'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escalate'
          description: ''
  /api/v1/cmo/grievances/{id}/remarks/:
    post:
      operationId: v1_cmo_grievances_remarks_create
      description: 'CMO: Add internal remark or observation to grievance history.'
      summary: 'CMO: Add internal remark to grievance history'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemarkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RemarkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemarkRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remark'
          description: ''
  /api/v1/cmo/reports/{id}/review/:
    post:
      operationId: v1_cmo_reports_review_create
      description: 'CMO: Review Action Taken Report filed by officer. Approves or
        rejects report.'
      summary: 'CMO: Review and Approve/Reject Action Taken Report'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewATRRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewATRRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewATRRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewATR'
          description: ''
  /api/v1/cmo/stats/:
    get:
      operationId: v1_cmo_stats_retrieve
      description: |-
        Live aggregated statistics for CMO executive dashboard.
        Computes total counts, status breakdown, SLA breaches, and distributions across
        Kerala's 14 districts, government departments, and priority levels.
      summary: 'CMO: Retrieve comprehensive dashboard metrics and distributions'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CMODashboardStatsResponse'
          description: ''
  /api/v1/departments/:
    get:
      operationId: v1_departments_list
      description: Public listing of active government departments.
      summary: List all active departments
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: v1_departments_retrieve
      description: Public retrieve view for specific department.
      summary: Get active department details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/grievances/track/:
    get:
      operationId: v1_grievances_track_retrieve
      description: Public tracking by reference number. Exposes zero private citizen
        data.
      summary: 'Public: Track grievance status by reference number'
      parameters:
      - in: query
        name: ref
        schema:
          type: string
        description: Grievance reference number (e.g. CMK-20261112-XXXXXXXX)
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGrievanceTrack'
          description: ''
        '404':
          description: Reference number not found
  /api/v1/officer/grievances/:
    get:
      operationId: v1_officer_grievances_list
      description: 'Officer: List only grievances assigned to the logged-in officer
        or their department.'
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: department
        schema:
          type: string
          format: uuid
      - in: query
        name: district
        schema:
          type: string
          enum:
          - ALAPPUZHA
          - ERNAKULAM
          - IDUKKI
          - KANNUR
          - KASARAGOD
          - KOLLAM
          - KOTTAYAM
          - KOZHIKODE
          - MALAPPURAM
          - PALAKKAD
          - PATHANAMTHITTA
          - THIRUVANANTHAPURAM
          - THRISSUR
          - WAYANAD
        description: |-
          Kerala District where grievance originated.

          * `ALAPPUZHA` - Alappuzha
          * `ERNAKULAM` - Ernakulam
          * `IDUKKI` - Idukki
          * `KANNUR` - Kannur
          * `KASARAGOD` - Kasaragod
          * `KOLLAM` - Kollam
          * `KOTTAYAM` - Kottayam
          * `KOZHIKODE` - Kozhikode
          * `MALAPPURAM` - Malappuram
          * `PALAKKAD` - Palakkad
          * `PATHANAMTHITTA` - Pathanamthitta
          * `THIRUVANANTHAPURAM` - Thiruvananthapuram
          * `THRISSUR` - Thrissur
          * `WAYANAD` - Wayanad
      - in: query
        name: is_escalated
        schema:
          type: boolean
      - in: query
        name: officer
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: |-
          Priority level assessed manually or via AI triage.

          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
      - name: search
