        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnquiry'
          description: ''
components:
  schemas:
    AIAnalyzeRequestRequest:
      type: object
      description: Request serializer for complaint triage analysis.
      properties:
        subject:
          type: string
          minLength: 5
          description: Subject or title of the citizen complaint.
          maxLength: 255
        description:
          type: string
          minLength: 15
          description: Detailed complaint description.
          maxLength: 5000
        district:
          allOf:
          - $ref: '#/components/schemas/DistrictEnum'
          description: |-
            One of the 14 revenue districts of Kerala.

            * `ALAPPUZHA` - Alappuzha
            * `ERNAKULAM` - Ernakulam
            * `IDUKKI` - Idukki
            * `KANNUR` - Kannur
            * `KASARAGOD` - Kasaragod
            * `KOLLAM` - Kollam
            * `KOTTAYAM` - Kottayam
            * `KOZHIKODE` - Kozhikode
            * `MALAPPURAM` - Malappuram
            * `PALAKKAD` - Palakkad
            * `PATHANAMTHITTA` - Pathanamthitta
            * `THIRUVANANTHAPURAM` - Thiruvananthapuram
            * `THRISSUR` - Thrissur
            * `WAYANAD` - Wayanad
      required:
      - description
      - district
      - subject
    AIAnalyzeResponse:
      type: object
      properties:
        suggestions:
          $ref: '#/components/schemas/AISuggestions'
        metadata:
          $ref: '#/components/schemas/AIMetadata'
        message:
          type: string
          default: AI analysis completed successfully.
      required:
      - metadata
      - suggestions
    AIMetadata:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        prompt_version:
          type: string
        timestamp:
          type: string
        validated:
          type: boolean
      required:
      - model
      - prompt_version
      - provider
      - timestamp
      - validated
    AISuggestions:
      type: object
      properties:
        suggested_department:
          type: string
        suggested_department_id:
          type: string
          format: uuid
          nullable: true
        suggested_department_code:
          type: string
          nullable: true
        suggested_category:
          type: string
        suggested_priority:
          $ref: '#/components/schemas/SuggestedPriorityEnum'
        summary:
          type: string
        duplicate_warning:
          type: boolean
          default: false
      required:
      - suggested_category
      - suggested_priority
      - summary
    ActionTakenReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique ATR report identifier.
        grievance:
          type: string
          format: uuid
          description: Grievance investigated.
          readOnly: true
        officer:
          type: string
          format: uuid
          description: Officer who executed the investigation and filed the report.
          readOnly: true
        officer_name:
          type: string
          readOnly: true
        investigation_description:
          type: string
          description: Detailed field findings and verification details.
        resolution_details:
          type: string
          description: Action implemented or corrective measures taken.
        report_attachment:
          type: string
          format: uri
          nullable: true
          description: Optional signed report PDF or photographic evidence of work
            done.
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          readOnly: true
          description: |-
            Status of CMO administrative review.

            * `PENDING` - Pending Review
            * `APPROVED` - Approved
            * `REJECTED` - Rejected
        reviewed_by:
          type: string
          format: uuid
          description: CMO Admin who approved or rejected the report.
          readOnly: true
          nullable: true
        reviewed_by_name:
          type: string
          readOnly: true
        review_remarks:
          type: string
          readOnly: true
          description: Observations or feedback provided during review.
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          description: Submission timestamp.
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp of review decision.
      required:
      - grievance
      - id
      - investigation_description
      - officer
      - officer_name
      - resolution_details
      - review_remarks
      - review_status
      - reviewed_at
      - reviewed_by
      - reviewed_by_name
      - submitted_at
    ActionTakenReportRequest:
      type: object
      properties:
        investigation_description:
          type: string
          minLength: 1
          description: Detailed field findings and verification details.
        resolution_details:
          type: string
          minLength: 1
          description: Action implemented or corrective measures taken.
        report_attachment:
          type: string
          format: binary
          nullable: true
          description: Optional signed report PDF or photographic evidence of work
            done.
      required:
      - investigation_description
      - resolution_details
    AssignDepartment:
      type: object
      properties:
        department_id:
          type: string
          format: uuid
        officer_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        remarks:
          type: string
      required:
      - department_id
    AssignDepartmentRequest:
      type: object
      properties:
        department_id:
          type: string
          format: uuid
        officer_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        remarks:
          type: string
      required:
      - department_id
    CMODashboardStatsResponse:
      type: object
      properties:
        overview:
          $ref: '#/components/schemas/DashboardOverview'
        priority_distribution:
          type: object
          additionalProperties:
            type: integer
        district_distribution:
          type: array
          items:
            $ref: '#/components/schemas/DistrictStat'
        department_distribution:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentStat'
      required:
      - department_distribution
      - district_distribution
      - overview
      - priority_distribution
    CitizenFeedback:
      type: object
